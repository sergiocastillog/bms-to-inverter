###################################################################
### Fidus FB-L-16 -> Axpert MAX Twin 8K, staged PYL test         ###
###################################################################

bms.pollInterval=1
bms.1.type=FIDUS_MODBUS
bms.1.id=1
bms.1.portLocator=/dev/serial/by-id/usb-FTDI_USB_Serial_Converter_FTB6SPL3-if00-port0
bms.1.baudRate=9600
bms.1.delayAfterNoBytes=1000

inverter.type=PYLON_RS485
inverter.portLocator=/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
inverter.baudRate=9600
# Request/response mode: the Pylon transport blocks briefly waiting for a frame.
inverter.sendInterval=0

webserver.service.enabled=false
